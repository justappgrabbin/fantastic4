plugins { id 'com.android.application' }
android {
    namespace 'com.fourcorners.computer'
    compileSdk 35
    defaultConfig { applicationId 'com.fourcorners.computer'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    androidResources { noCompress += ['bundle'] }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'org.apache.commons:commons-compress:1.27.1' }
